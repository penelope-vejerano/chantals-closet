<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chantal's Closet | Clothes</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="clothes-page">

  <!-- IMAGE VIEWER -->
  <div class="image-modal" id="imageModal">
    <span class="image-modal-close" id="imageModalClose">×</span>
    <img id="fullImage" src="" alt="Full product image">
  </div>

  <!-- HEADER -->
  <header class="header">
    <h1 class="logo">chantal's closet</h1>

    <nav class="nav-buttons">
      <button onclick="location.href='index.html'">owner</button>
      <button onclick="location.href='clothes.html'">clothes</button>
      <button onclick="location.href='home.html'">home</button>
      <button onclick="location.href='buy.html'" class="buy-btn-header">buy</button>
      <button onclick="location.href='account.html'" class="account-btn">account</button>
    </nav>
  </header>

  <main class="clothes-content">

    <h1 class="page-title">our little closet</h1>

    <p class="page-subtitle">
      find a little something dreamy for your wardrobe
    </p>

    <!-- CATEGORIES -->
    <section class="category-section">
      <button onclick="location.href='#tops'">tops</button>
      <button onclick="location.href='#bottoms'">bottoms</button>
      <button onclick="location.href='#bags'">bags</button>
      <button onclick="location.href='#shoes'">shoes</button>
    </section>

    <!-- SEARCH -->
    <section class="search-section">
      <div class="search-box">
        <span class="search-icon">⌕</span>

        <input
          type="text"
          id="searchInput"
          placeholder="search for something cute..."
        >

        <button onclick="searchProducts()">search</button>
      </div>
    </section>

    <!-- TOPS -->
    <section class="product-category" id="tops">
      <h2>tops ♡</h2>
      <div class="product-grid"></div>
    </section>

    <!-- BOTTOMS -->
    <section class="product-category" id="bottoms">
      <h2>bottoms ♡</h2>
      <div class="product-grid"></div>
    </section>

    <!-- BAGS -->
    <section class="product-category" id="bags">
      <h2>bags ♡</h2>
      <div class="product-grid"></div>
    </section>

    <!-- SHOES -->
    <section class="product-category" id="shoes">
      <h2>shoes ♡</h2>
      <div class="product-grid"></div>
    </section>

  </main>

  <script src="products.js"></script>
  <script src="basket.js"></script>
  <script>
    function searchProducts() {
      const searchInput = document.getElementById("searchInput");
      const searchValue = searchInput.value.toLowerCase().trim();
      const products = document.querySelectorAll(".product-card");

      products.forEach(function(product) {
        const productName = product
          .querySelector("h3")
          .textContent
          .toLowerCase();

        if (searchValue === "" || productName.includes(searchValue)) {
          product.style.display = "block";
        } else {
          product.style.display = "none";
        }
      });
    }

    document.getElementById("searchInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        searchProducts();
      }
    });
  </script>

</body>
</html>
