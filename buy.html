<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chantal's Closet | Buy</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="buy-page">

  <!-- HEADER -->
  <header class="header">
    <h1 class="logo">chantal's closet</h1>

    <nav class="nav-buttons">
      <button onclick="location.href='index.html'">owner</button>
      <button onclick="location.href='clothes.html'">clothes</button>
      <button onclick="location.href='home.html'">home</button>
      <button onclick="location.href='buy.html'" class="buy-btn-header">buy</button>
      <button onclick="location.href='account.html'" class="account-btn">account</button>
    </nav>
  </header>

  <main class="buy-content">

    <!-- INTRO -->
    <section class="buy-intro">
      <p class="small-heading">your little treasures ♡</p>

      <h1>your basket</h1>

      <p>
        review your chosen pieces before bringing them home
      </p>
    </section>

    <!-- CART -->
    <section class="cart-section">

      <h2>your picks</h2>

      <div class="empty-basket" id="emptyBasket">
        <p>your basket is empty for now ♡</p>
        <p>head to our closet and add something dreamy</p>
      </div>

      <div id="cartItems"></div>

      <!-- SUMMARY -->
      <div class="cart-summary" id="cartSummary" hidden>

        <div class="summary-row">
          <span>subtotal</span>
          <span id="subtotalAmount">₱0</span>
        </div>

        <div class="summary-row">
          <span>shipping</span>
          <span id="shippingAmount">₱80</span>
        </div>

        <div class="summary-row total-row">
          <span>total</span>
          <span id="totalAmount">₱0</span>
        </div>

        <button class="checkout-button" type="button">
          proceed to checkout ♡
        </button>

      </div>

    </section>

    <!-- CONTINUE SHOPPING -->
    <section class="continue-shopping">

      <p>found something else you love?</p>

      <button
        onclick="location.href='clothes.html'"
        class="continue-button"
      >
        continue shopping
      </button>

    </section>

  </main>

  <script src="basket.js"></script>
  <script>
    const SHIPPING_FEE = 80;

    function renderBasket() {
      const basket = getBasket();
      const cartItems = document.getElementById("cartItems");
      const emptyBasket = document.getElementById("emptyBasket");
      const cartSummary = document.getElementById("cartSummary");

      cartItems.innerHTML = "";

      if (basket.length === 0) {
        emptyBasket.hidden = false;
        cartSummary.hidden = true;
        return;
      }

      emptyBasket.hidden = true;
      cartSummary.hidden = false;

      let subtotal = 0;

      basket.forEach(function(item) {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;

        const cartItem = document.createElement("div");
        cartItem.className = "cart-item";
        cartItem.innerHTML =
          '<img src="' + item.image + '" alt="' + item.name + '">' +
          '<div class="cart-item-info">' +
            '<h3>' + item.name + '</h3>' +
            '<p class="cart-price">' + formatPrice(item.price) + '</p>' +
          '</div>' +
          '<div class="quantity">' +
            '<button type="button" data-action="decrease" data-id="' + item.id + '">-</button>' +
            '<span>' + item.quantity + '</span>' +
            '<button type="button" data-action="increase" data-id="' + item.id + '">+</button>' +
          '</div>' +
          '<p class="item-total">' + formatPrice(itemTotal) + '</p>';

        cartItems.appendChild(cartItem);
      });

      document.getElementById("subtotalAmount").textContent = formatPrice(subtotal);
      document.getElementById("shippingAmount").textContent = formatPrice(SHIPPING_FEE);
      document.getElementById("totalAmount").textContent = formatPrice(subtotal + SHIPPING_FEE);
    }

    document.getElementById("cartItems").addEventListener("click", function(event) {
      const button = event.target.closest("button[data-action]");

      if (!button) {
        return;
      }

      const change = button.dataset.action === "increase" ? 1 : -1;
      updateBasketQuantity(button.dataset.id, change);
      renderBasket();
    });

    document.addEventListener("DOMContentLoaded", renderBasket);
  </script>

</body>
</html>
