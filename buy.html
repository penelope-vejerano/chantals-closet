<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chantal's Closet | Buy</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="buy-page">

  <!-- HEADER -->
  <header class="header">
    <h1 class="logo">chantal's closet</h1>

    <nav class="nav-buttons">
      <button onclick="location.href='index.html'">owner</button>
      <button onclick="location.href='clothes.html'">clothes</button>
      <button onclick="location.href='home.html'">home</button>
      <button onclick="location.href='buy.html'" class="buy-btn-header">buy</button>
      <button onclick="location.href='account.html'" class="account-btn">account</button>
    </nav>
  </header>

  <main class="buy-content">

    <!-- INTRO -->
    <section class="buy-intro">
      <p class="small-heading">your little treasures ♡</p>

      <h1>your basket</h1>

      <p>
        review your chosen pieces before bringing them home
      </p>
    </section>

    <!-- CART -->
    <section class="cart-section">

      <h2>your picks</h2>

      <div class="cart-item">

        <img src="assets/top1.jpg" alt="Pink floral top">

        <div class="cart-item-info">
          <h3>pink floral top</h3>
          <p>size: medium</p>
          <p class="cart-price">₱350</p>
        </div>

        <div class="quantity">
          <button>-</button>
          <span>1</span>
          <button>+</button>
        </div>

        <p class="item-total">₱350</p>

      </div>

      <div class="cart-item">

        <img src="assets/bag1.jpg" alt="Pink shoulder bag">

        <div class="cart-item-info">
          <h3>pink shoulder bag</h3>
          <p>one size</p>
          <p class="cart-price">₱600</p>
        </div>

        <div class="quantity">
          <button>-</button>
          <span>1</span>
          <button>+</button>
        </div>

        <p class="item-total">₱600</p>

      </div>

      <!-- SUMMARY -->
      <div class="cart-summary">

        <div class="summary-row">
          <span>subtotal</span>
          <span>₱950</span>
        </div>

        <div class="summary-row">
          <span>shipping</span>
          <span>₱80</span>
        </div>

        <div class="summary-row total-row">
          <span>total</span>
          <span>₱1,030</span>
        </div>

        <button class="checkout-button">
          proceed to checkout ♡
        </button>

      </div>

    </section>

    <!-- CONTINUE SHOPPING -->
    <section class="continue-shopping">

      <p>found something else you love?</p>

      <button
        onclick="location.href='clothes.html'"
        class="continue-button"
      >
        continue shopping
      </button>

    </section>

  </main>

</body>
</html>
